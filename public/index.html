<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cruzr Chat</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mut:#5b6785;--ac:#2563eb;--actx:#fff;--bot:#e3eafb;--bd:#d5dbea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--card:#18203a;--tx:#eef2ff;--mut:#9aa6c7;--ac:#5b8cff;--actx:#0b1020;--bot:#232d4f;--bd:#2c3760}}
:root[data-theme="dark"]{--bg:#0f1524;--card:#18203a;--tx:#eef2ff;--mut:#9aa6c7;--ac:#5b8cff;--actx:#0b1020;--bot:#232d4f;--bd:#2c3760}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;display:flex;flex-direction:column;font-size:1.25rem}
header{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:1.3rem;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:999px}
.sm{background:var(--bot);color:var(--tx);padding:.5rem 1.1rem}
#log{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.7rem}
.m{max-width:85%;padding:.8rem 1.1rem;border-radius:1.2rem;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.u{align-self:flex-start;background:var(--ac);color:var(--actx)}
.b{align-self:flex-end;background:var(--bot)}
#st{min-height:1.6rem;text-align:center;color:var(--mut);font-size:1rem}
footer{display:flex;gap:.6rem;padding:.8rem 1rem;background:var(--card);border-top:1px solid var(--bd);align-items:center}
input{flex:1;min-width:0;font:inherit;padding:.9rem 1.1rem;border-radius:999px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
#mic,#go{width:4rem;height:4rem;background:var(--ac);color:var(--actx);font-size:1.5rem;flex:none}
#mic.on{animation:p 1s infinite}
@keyframes p{50%{transform:scale(1.12)}}
</style>
</head>
<body>
<header>
  <h1 id="ti"></h1>
  <div><button class="sm" id="vo"></button> <button class="sm" id="lg"></button></div>
</header>
<div id="log"></div>
<div id="st"></div>
<footer>
  <button id="mic" aria-label="mic">🎤</button>
  <input id="in" autocomplete="off">
  <button id="go" aria-label="send">➤</button>
</footer>
<script>
// Optional: put your own backend URL here (POST {messages, system} -> {reply}) when hosting this page yourself.
var CONFIG = { endpoint: "/chat" };

var T = {
  ar: { ti: "روبوت المحادثة", ph: "اكتب رسالتك…", hi: "هلا! أنا روبوت Cruzr. تكلم معي بالعربي أو الإنجليزي.", listen: "أسمعك…", think: "أفكر…", err: "تعذّر الاتصال بالذكاء الاصطناعي.", nomic: "المتصفح ما يدعم التعرف على الصوت، اكتب رسالتك.", lg: "English", von: "🔊 الصوت", voff: "🔇 الصوت" },
  en: { ti: "Cruzr Chat", ph: "Type your message…", hi: "Hi! I’m Cruzr. Talk to me in Arabic or English.", listen: "Listening…", think: "Thinking…", err: "Couldn’t reach the AI.", nomic: "Voice recognition isn’t supported here, please type.", lg: "عربي", von: "🔊 Voice", voff: "🔇 Voice" }
};
var SYS = "You are Cruzr, a friendly service robot. Reply in the same language the user wrote in (Arabic or English; for Arabic use simple clear Arabic). Keep answers short (1 to 3 sentences) because they are spoken aloud. Plain text only: no markdown, no emojis, no lists.";
var lang = "ar", hist = [], busy = false, voiceOn = true, rec = null;
var $ = function (id) { return document.getElementById(id); };
var log = $("log"), inp = $("in"), st = $("st");

function apply() {
  var t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("ti").textContent = t.ti; inp.placeholder = t.ph; $("lg").textContent = t.lg;
  $("vo").textContent = voiceOn ? t.von : t.voff;
}
function add(cls, text) {
  var d = document.createElement("div");
  d.className = "m " + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function speak(text) {
  if (!voiceOn || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = /[\u0600-\u06FF]/.test(text) ? "ar-SA" : "en-US";
    speechSynthesis.speak(u);
  } catch (e) {}
}
var samplePromise = (window.claude && claude.use) ? claude.use("sample").catch(function () { return null; }) : Promise.resolve(null);

async function ask(text) {
  if (busy || !text.trim()) return;
  busy = true; inp.value = "";
  add("u", text); hist.push({ role: "user", content: text });
  var bubble = add("b", "…"); st.textContent = T[lang].think;
  try {
    var out;
    if (CONFIG.endpoint) {
      var r = await fetch(CONFIG.endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ system: SYS, messages: hist.slice(-11) }) });
      out = (await r.json()).reply;
    } else {
      var s = await samplePromise;
      if (!s) throw new Error("no-ai");
      var msgs = hist.slice(-11).map(function (m) { return { role: m.role, content: m.content }; });
      msgs[msgs.length - 1].content = SYS + "\n\nUser message:\n" + text;
      var res = await s(msgs, { cache: false, onText: function (o) { bubble.textContent = o.text; log.scrollTop = log.scrollHeight; } });
      out = res.text;
    }
    bubble.textContent = out; hist.push({ role: "assistant", content: out }); speak(out);
  } catch (e) {
    bubble.textContent = T[lang].err; hist.pop();
  }
  st.textContent = ""; busy = false;
}
function listen() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { st.textContent = T[lang].nomic; return; }
  if (rec) { try { rec.stop(); } catch (e) {} return; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  rec = new SR(); rec.lang = lang === "ar" ? "ar-SA" : "en-US"; rec.interimResults = true;
  rec.onresult = function (e) {
    var t = ""; for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    inp.value = t;
    if (e.results[e.results.length - 1].isFinal) ask(t);
  };
  rec.onend = function () { rec = null; $("mic").classList.remove("on"); if (st.textContent === T[lang].listen) st.textContent = ""; };
  rec.onerror = function () { rec = null; $("mic").classList.remove("on"); st.textContent = ""; };
  $("mic").classList.add("on"); st.textContent = T[lang].listen;
  try { rec.start(); } catch (e) { rec = null; }
}
$("mic").onclick = listen;
$("go").onclick = function () { ask(inp.value); };
inp.onkeydown = function (e) { if (e.key === "Enter") ask(inp.value); };
$("lg").onclick = function () { lang = lang === "ar" ? "en" : "ar"; apply(); };
$("vo").onclick = function () { voiceOn = !voiceOn; if (!voiceOn && window.speechSynthesis) speechSynthesis.cancel(); apply(); };
apply(); add("b", T[lang].hi);
</script>
</body>
</html>
